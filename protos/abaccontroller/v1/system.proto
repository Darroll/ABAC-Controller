syntax = "proto3";

package abaccontroller.v1;
option csharp_namespace = "AbacController.Api.Grpc";

import "abaccontroller/v1/common.proto";
import "google/api/annotations.proto";

service SystemApi {
  rpc GetStatus(GetStatusRequestMessage) returns (GetStatusResponseMessage) {
    option (google.api.http) = { get: "/system/grpc/status" };
  }

  rpc ListRegisteredSpifs(ListRegisteredSpifsRequestMessage) returns (ListRegisteredSpifsResponseMessage) {
    option (google.api.http) = { get: "/system/grpc/spifs/registered" };
  }

  rpc QueryAudit(QueryAuditRequestMessage) returns (QueryAuditResponseMessage) {
    option (google.api.http) = {
      post: "/system/grpc/audit/query"
      body: "*"
    };
  }
}

message GetStatusRequestMessage {}

message GetStatusResponseMessage {
  bool startup_completed = 1;
  bool ready = 2;
  string version = 3;
  repeated string registered_label_codecs = 4;
}

message ListRegisteredSpifsRequestMessage {}

message ListRegisteredSpifsResponseMessage {
  repeated string policy_oids = 1;
}

message QueryAuditRequestMessage {
  string from = 1;
  string to = 2;
  string subject_id = 3;
  string resource_id = 4;
  string event_type = 5;
  string decision = 6;
  int32 page_size = 7;
  int32 page = 8;
}

message QueryAuditResponseMessage {
  repeated AuditEventMessage events = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
  int32 total_pages = 5;
}
