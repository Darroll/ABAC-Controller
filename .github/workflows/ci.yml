name: CI

# Runs entirely on a self-hosted runner inside the LAN.
# Source lives on GitHub; every build artifact, image, scan result and
# deployment stays on 192.168.2.x and never leaves the network.
#
# The runner image (ci/Dockerfile.runner) has the .NET SDK, docker CLI and
# ssh client baked in, so steps run tooling directly rather than nesting
# into another container. See that file for why nesting broke the
# integration fixtures.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  REGISTRY: 192.168.2.3:5000
  IMAGE_NAME: abac-controller
  VOLTRON: root@192.168.2.3
  DEPLOY_KEY: /deploy/id_ed25519

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore AbacController.slnx

      - name: Build
        run: dotnet build AbacController.slnx --no-restore -c Release -warnaserror

      - name: Unit tests
        run: >-
          dotnet test tests/AbacController.Tests.Unit/AbacController.Tests.Unit.csproj
          --no-build -c Release
          --logger "trx;LogFileName=unit-results.trx"
          --results-directory ./TestResults

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ./TestResults/*.trx
          if-no-files-found: warn

  integration-test:
    name: Integration Tests
    runs-on: [self-hosted, linux, x64]
    needs: build-and-test
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build -t "${IMAGE_NAME}:test" .

      - name: Integration tests
        env:
          ABAC_DOCKER_IMAGE: ${{ env.IMAGE_NAME }}:test
        run: |
          dotnet restore AbacController.slnx
          dotnet build AbacController.slnx --no-restore -c Release
          dotnet test tests/AbacController.Tests.Integration/AbacController.Tests.Integration.csproj \
            --no-build -c Release \
            --logger "trx;LogFileName=integration-results.trx" \
            --results-directory ./TestResults

      - name: Collect stray test containers
        if: always()
        run: docker ps -aq --filter "name=abac-it-" | xargs -r docker rm -f

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ./TestResults/*.trx
          if-no-files-found: warn

  security-scan:
    name: SAST & SBOM
    runs-on: [self-hosted, linux, x64]
    needs: build-and-test
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Semgrep OSS. Findings stay on this box as an artifact; nothing is
      # uploaded to any hosted service.
      - name: Semgrep (SAST)
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD":/src -w /src \
            semgrep/semgrep semgrep scan \
              --config p/csharp --config p/security-audit --config p/secrets \
              --sarif --output reports/semgrep.sarif \
              --metrics=off || true
          echo "semgrep findings: $(grep -o '"ruleId"' reports/semgrep.sarif 2>/dev/null | wc -l)"

      - name: CycloneDX SBOM
        run: |
          mkdir -p reports
          dotnet tool install --global CycloneDX >/dev/null 2>&1 || true
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet CycloneDX AbacController.slnx -o reports --filename sbom.json --json

      - name: Vulnerable package audit
        run: |
          mkdir -p reports
          dotnet restore AbacController.slnx
          dotnet list AbacController.slnx package --vulnerable --include-transitive \
            | tee reports/vulnerable-packages.txt
          if grep -qiE '(Critical|High)' reports/vulnerable-packages.txt; then
            echo "::error::High or critical severity vulnerable packages found"
            exit 1
          fi

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          if-no-files-found: warn

  publish:
    name: Build & Push Image
    runs-on: [self-hosted, linux, x64]
    needs: [integration-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tag
        id: meta
        run: |
          TAG="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG"

      # The runner already trusts the registry CA and holds a docker login,
      # so no registry credentials are stored in GitHub.
      - name: Build and push
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          docker build \
            -t "${REGISTRY}/${IMAGE_NAME}:${TAG}" \
            -t "${REGISTRY}/${IMAGE_NAME}:latest" .
          docker push "${REGISTRY}/${IMAGE_NAME}:${TAG}"
          docker push "${REGISTRY}/${IMAGE_NAME}:latest"

      - name: Scan published image
        run: |
          mkdir -p reports
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/reports":/reports \
            aquasec/trivy:latest image \
              --scanners vuln --severity HIGH,CRITICAL \
              --format table --output /reports/trivy.txt \
              "${REGISTRY}/${IMAGE_NAME}:${{ steps.meta.outputs.tag }}" || true
          cat reports/trivy.txt || true

      - name: Upload image scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-scan
          path: reports/trivy.txt
          if-no-files-found: warn

  deploy:
    name: Deploy to Voltron
    runs-on: [self-hosted, linux, x64]
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The deploy key is mounted into the runner from the host, so the
      # private key never lives in GitHub secrets.
      - name: Deploy compose stack
        run: |
          TAG="${{ needs.publish.outputs.tag }}"
          SSH="ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ${DEPLOY_KEY}"
          REMOTE=/mnt/user/appdata/abac-controller

          $SSH "$VOLTRON" "mkdir -p ${REMOTE}/data"
          scp -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i "${DEPLOY_KEY}" \
            deploy/docker-compose.yml "${VOLTRON}:${REMOTE}/docker-compose.yml"
          $SSH "$VOLTRON" "cd ${REMOTE} \
            && echo 'ABAC_IMAGE_TAG=${TAG}' > .env \
            && docker compose pull \
            && docker compose up -d \
            && docker compose ps"

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
              http://192.168.2.3:8090/health/ready || true)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then
              echo "ABAC Controller is live on Voltron at tag ${{ needs.publish.outputs.tag }}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::service did not become ready"
          exit 1
