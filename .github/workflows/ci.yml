name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore AbacController.slnx

      - name: Build
        run: dotnet build AbacController.slnx --no-restore -c Release -warnaserror

      - name: Unit Tests
        run: >-
          dotnet test tests/AbacController.Tests.Unit/AbacController.Tests.Unit.csproj
          --no-build -c Release
          --logger "trx;LogFileName=unit-results.trx"
          --results-directory ./TestResults

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ./TestResults/*.trx

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore AbacController.slnx

      - name: Build
        run: dotnet build AbacController.slnx --no-restore -c Release

      - name: Build Docker Image (for Testcontainers)
        run: docker build -t abac-controller:test .

      - name: Integration Tests
        run: >-
          dotnet test tests/AbacController.Tests.Integration/AbacController.Tests.Integration.csproj
          --no-build -c Release
          --logger "trx;LogFileName=integration-results.trx"
          --results-directory ./TestResults
        env:
          ABAC_DOCKER_IMAGE: abac-controller:test

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ./TestResults/*.trx
