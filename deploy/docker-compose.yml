# ABAC Controller - Voltron (Unraid) deployment stack.
#
# Deployed to /mnt/user/appdata/abac-controller/ by the CI deploy job.
# ABAC_IMAGE_TAG is written into a sibling .env file by that job; it falls
# back to "latest" for manual runs.

services:
  abac-controller:
    image: 192.168.2.3:5000/abac-controller:${ABAC_IMAGE_TAG:-latest}
    container_name: abac-controller
    restart: unless-stopped
    # Host ports 8080/8081 are already taken on Voltron by binhex-sabnzbd and
    # open-webui, so publish on 8090/8091 instead. Container ports are unchanged.
    ports:
      - "8090:8080"   # HTTP / REST
      - "8091:8081"   # gRPC
    volumes:
      - /mnt/user/appdata/abac-controller/data:/data
    environment:
      TZ: America/New_York
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ABAC_Database__ConnectionString: "Data Source=/data/abac-controller.db"
      # The app refuses to start unless some authentication is configured.
      # Machine-to-machine API key auth; the value lives only in the .env file
      # the deploy job writes on Voltron, never in this repo.
      ABAC_Auth__ApiKeys__0__Key: "${ABAC_API_KEY:?ABAC_API_KEY must be set}"
      ABAC_Auth__ApiKeys__0__ClientId: "ci-deploy"
      ABAC_Auth__ApiKeys__0__Description: "Provisioned by CI on first deploy"
      ABAC_Auth__ApiKeys__0__Scopes__0: "abac:evaluate"
      ABAC_Auth__ApiKeys__0__Scopes__1: "abac:sys:read"
      ABAC_Auth__ApiKeys__0__Scopes__2: "abac:policy:read"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
